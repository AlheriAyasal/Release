:root[data-theme="dark"]{--bg:#0f1424;--card:#171e33;--ink:#e8ecf8;--muted:#9aa5c6;--line:#2a3350;--acc:#8c9bff;--onacc:#0f1424;--field:#0f1424}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:16px 16px 48px}
.sub{color:var(--muted);margin:0 0 14px}.note{color:var(--muted);font-size:14px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font:600 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:10px 18px;font-weight:600;margin-top:16px}
button.s{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.panel label,.fl{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.logo{font:italic 500 clamp(68px,17vw,120px)/1 "Cormorant Garamond",Georgia,serif;margin:0}
.land{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.go{display:flex;align-items:center;gap:14px;margin-top:28px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:12px 26px 12px 14px;font-weight:600;font-size:18px}

.mini{font:italic 500 28px "Cormorant Garamond",Georgia,serif}
.ph{font:italic 500 38px/1.1 "Cormorant Garamond",Georgia,serif;margin:8px 0 2px}

.cover{background:var(--cv);aspect-ratio:4/3;display:grid;place-items:center;border-radius:6px 12px 12px 6px;box-shadow:inset 8px 0 8px -6px rgba(0,0,0,.35);position:relative;overflow:hidden;font-family:var(--bf)}

.lbl{display:inline-block;background:var(--pp);color:var(--ik);padding:4px 12px;border-radius:3px;font-size:18px;font-family:var(--bf);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.th{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px}
.th[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:1px}
.th .cover{aspect-ratio:3/4}
.th .lbl{font-size:14px}
.smp{background:var(--pp);color:var(--ik);padding:12px;border-radius:6px;font-size:20px;line-height:1.4;min-height:96px}
.swt{display:flex;gap:10px;margin:8px 0;justify-content:center}
.swt button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.swt button[aria-pressed=true]{outline:3px solid var(--acc);outline-offset:2px}
.sheet{background:var(--pp);color:var(--ik);border-radius:8px;overflow:hidden;font-family:var(--bf);box-shadow:0 2px 12px rgba(0,0,0,.2);margin-bottom:16px}
.band{background:var(--cv);padding:14px 18px 18px;position:relative}
.sheet.lace .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:radial-gradient(circle at 50% 100%,transparent 6px,#f6efe0 7px) 0 0/16px 10px}
.body{padding:16px 20px 22px}
.sheet label{display:block;font:600 13px Inter,sans-serif;margin:12px 0 2px;opacity:.75}
.sheet input,.sheet textarea,.sheet select{background:transparent;color:var(--ik);border:0;border-bottom:1px solid rgba(0,0,0,.3);border-radius:0;padding:6px 2px;font:inherit}
.sheet textarea{min-height:170px;resize:vertical;line-height:1.7;border:1px solid rgba(0,0,0,.2);border-radius:4px;padding:8px}
.sheet select option{color:#222}
.sheet button.p{background:var(--ik);color:var(--pp)}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:22px;padding:4px 8px;background:transparent;border:1px solid rgba(0,0,0,.25);border-radius:8px}
.moods button[aria-pressed=true]{outline:2px solid var(--ik);background:rgba(0,0,0,.1)}
.tags{opacity:.7;font-size:14px}
.entry{border-top:1px solid rgba(128,128,128,.3);padding:12px 0}.entry p{margin:4px 0;white-space:pre-wrap}.entry small{opacity:.7}
.msg{font-weight:600;margin-top:8px;min-height:1.4em}
.pg{min-height:400px;padding:22px 24px;line-height:1.75}
.pg h3{font-size:26px;margin:0 0 4px;font-weight:500}.pg p{white-space:pre-wrap;margin:8px 0}
.pg.c{display:grid;place-items:center;text-align:center}
.im{max-width:100%;border-radius:4px;display:block}
.im.small{float:left;width:36%;margin:4px 16px 8px 0}
.im.cap{margin:0 auto 10px;max-height:340px}
.cp{text-align:center;font-style:italic}
.nv{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.months{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.code{font:600 20px "Courier Prime",monospace;letter-spacing:.08em;padding:10px;background:var(--bg);border:1px dashed var(--line);border-radius:6px;margin-top:8px;word-break:break-all}
</style></head>

var te=new TextEncoder();
function b64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function dk(p,salt){return crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']).then(function(m){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt'])})}
function enc(t,p){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 return dk(p,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,te.encode(t))}).then(function(ct){var c=new Uint8Array(ct),o=new Uint8Array(28+c.length);o.set(salt);o.set(iv,16);o.set(c,28);return 'REL1:'+b64(o)})}
