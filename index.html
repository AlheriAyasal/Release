function unb(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function dec(s,p){var m=s.match(/REL1:([A-Za-z0-9+\/=]+)/);if(!m)return Promise.reject();var o=unb(m[1]),salt=o.slice(0,16),iv=o.slice(16,28),ct=o.slice(28);return dk(p,salt).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct)}).then(function(b){return new TextDecoder().decode(b)})}
